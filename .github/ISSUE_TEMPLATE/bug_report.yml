name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension version
    validations: { required: true }
  - type: input
    id: vscode
    attributes:
      label: VS Code version / OS
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the HCL snippet (provider/resource) where hovering fails, if applicable.
    validations: { required: true }

name: Package or Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip publishing to the Marketplace'
        required: false
        type: boolean
        default: true

  push:
    branches:
      - master
    paths:
      - "server/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - master
    paths:
      - "server/**"
      - "client/**"


env:
  PUBLISHER: LemurDaniel
  PAT: ${{ secrets.PUBLISH_PAT }}


jobs:
  build:
    # Automated PRs (providerCheck) are merged instantly and dispatch this workflow themselves
    if: ${{ !contains(github.head_ref, 'automated_') }}

    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Push to master always publishes, manual dispatch only with skip_publish=false
      PUBLISH: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_publish == false)) }}

    steps:
      - uses: actions/checkout@v2
          
      
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'
  

      - name: Install vsce
        shell: pwsh
        run: |
          npm install -g @vscode/vsce@3.5.0

          # Workaround for css-select@5.2.1 issue:
          npm install css-select@5.2.0 --prefix "$(npm root -g)/@vscode/vsce"
          
          npx vsce --version

      - name: Install dependencies
        run: |
          npm install

      - name: Package extension
        if: env.PUBLISH != 'true'
        run: |
          npx vsce package

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH != 'true'
        with:
          name: Upload Extension package
          path: |
            ./*.vsix
          
      - name: Publish extension to Marketplace
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          npx vsce package
          npx vsce publish --packagePath (Get-Item ./*.vsix).FullName --pat ${{ env.PAT }}

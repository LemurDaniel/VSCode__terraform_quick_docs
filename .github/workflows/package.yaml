name: Package or Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip publishing to the Marketplace'
        required: false
        type: boolean
        default: true

  # push:
  #   branches:
  #     - master
  #   paths:
  #     - "server/**"
  #     - "client/**"
  #     - "package.json"
  pull_request:
    branches:
      - master
    paths:
      - "server/**"
      - "client/**"


env:
  PUBLISHER: LemurDaniel
  PAT: ${{ secrets.PUBLISH_PAT }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2
          
      
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'
  

      - name: Install vsce
        shell: pwsh
        run: |
          npm install -g @vscode/vsce@3.5.0

          # Workaround for css-select@5.2.1 issue:
          npm install css-select@5.2.0 --prefix "$(npm root -g)/@vscode/vsce"
          
          npx vsce --version

      - name: Install dependencies
        run: |
          npm install

      - name: Package extension
        if: inputs.skip_publish == true || github.event_name == 'pull_request'
        run: |
          npx vsce package

      - uses: actions/upload-artifact@v4
        if: inputs.skip_publish == true || github.event_name == 'pull_request'
        with:
          name: Upload Extension package
          path: |
            ./*.vsix
          
      - name: Publish extension to Marketplace
        if: inputs.skip_publish == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          npx vsce package
          npx vsce publish --packagePath (Get-Item ./*.vsix).FullName --pat ${{ env.PAT }}

      - name: Create GitHub Release
        if: inputs.skip_publish == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $changelog = Get-Content CHANGELOG.md -Raw
          $notes = if ($changelog -match "(?ms)^## \[$([regex]::Escape($version))\]\s*(.*?)(?=^## \[|\z)") { $Matches[1].Trim() } else { "Release $version" }
          Set-Content -Path release-notes.md -Value $notes
          gh release create "v$version" (Get-Item ./*.vsix).FullName --title "v$version" --notes-file release-notes.md --target "$env:GITHUB_SHA"

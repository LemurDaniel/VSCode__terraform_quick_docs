name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: npm audit fix

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          npm install

      - name: Audit and fix (including breaking changes)
        id: audit
        shell: pwsh
        run: |
          $packages = '.', 'client', 'server'
          $summary = foreach ($package in $packages) {
            Push-Location $package
            $before = (npm audit --json | ConvertFrom-Json).metadata.vulnerabilities.total
            npm audit fix --force
            $after = (npm audit --json | ConvertFrom-Json).metadata.vulnerabilities.total
            Pop-Location
            "| $package | $before | $after |"
          }

          "| Package | Before | After |", "|---|---|---|", $summary, "" | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append

          $changed = [bool](git status --porcelain -- '*package-lock.json' '*package.json')
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Detect breaking changes
        id: breaking
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          # Major of a semver range, 0.x counts minor as major
          function Get-Major([string] $range) {
            if ($range -match '(\d+)(?:\.(\d+))?') { ($Matches[1] -eq '0') ? "0.$($Matches[2])" : $Matches[1] }
          }

          $rows = foreach ($package in '.', 'client', 'server') {
            $path = "$package/package.json" -replace '^\./', ''
            $old = git show "HEAD:$path" | ConvertFrom-Json
            $new = Get-Content $path | ConvertFrom-Json

            foreach ($type in 'dependencies', 'devDependencies') {
              $oldDeps = $old.$type.PSObject.Properties
              foreach ($dep in $oldDeps) {
                $newRange = $new.$type.($dep.Name)
                if ((Get-Major $dep.Value) -ne (Get-Major $newRange)) {
                  "| $package | $($dep.Name) | $($dep.Value) | $($newRange ?? 'removed') |"
                }
              }
            }
          }

          $breaking = [bool]$rows
          "breaking=$($breaking.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($breaking) {
            "### ⚠️ Breaking changes", "| Package | Dependency | Before | After |", "|---|---|---|---|", $rows, "" | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Verify lint and build
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          npm run lint *> lint.log
          $lint = $LASTEXITCODE
          npm run package *> build.log
          $build = $LASTEXITCODE

          "### Checks", "- lint: $(($lint -eq 0) ? '✅' : '❌')", "- build: $(($build -eq 0) ? '✅' : '❌')", "" | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "### package.json changes", '```diff', (git diff -- '*package.json'), '```' | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Remove-Item lint.log, build.log
          exit 0

      - name: Bump version and changelog
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $entry = "## [$version]`n`n### Update`n`n- Security: dependency updates via ``npm audit fix --force```n`n"
          Set-Content CHANGELOG.md -Value ($entry + (Get-Content CHANGELOG.md -Raw)) -NoNewline
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create Pull-Request
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BREAKING: ${{ steps.breaking.outputs.breaking }}
        run: |
          # automated_ prefix skips the pull_request build in package.yaml
          $branch = "automated_security_audit_fix"

          git config --global user.email "landau.daniel.1998@gmail.com"
          git config --global user.name "LemurDaniel"

          git checkout -B $branch
          git add -A
          git commit -m "Security: npm audit fix ($env:VERSION)"
          git push --force --set-upstream origin $branch

          $title = "Security: npm audit fix ($env:VERSION)"
          if (gh pr list --head $branch --state open --json number --jq '.[].number') {
            gh pr edit $branch --title $title --body-file "$env:RUNNER_TEMP/pr-body.md"
          }
          else {
            gh pr create --base master --head $branch --title $title --body-file "$env:RUNNER_TEMP/pr-body.md"
          }

          gh label create breaking-change --color B60205 --description "Major version changes in dependencies" --force
          if ($env:BREAKING -eq 'true') {
            gh pr edit $branch --add-label breaking-change
          }
          else {
            gh pr edit $branch --remove-label breaking-change 2>$null
            exit 0
          }

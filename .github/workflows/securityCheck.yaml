name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  audit:
    name: npm audit fix

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          npm install

      - name: Audit and fix
        id: audit
        shell: pwsh
        run: |
          $packages = '.', 'client', 'server'
          $summary = foreach ($package in $packages) {
            Push-Location $package
            $before = (npm audit --json | ConvertFrom-Json).metadata.vulnerabilities.total
            npm audit fix
            $after = (npm audit --json | ConvertFrom-Json).metadata.vulnerabilities.total
            Pop-Location
            "| $package | $before | $after |"
          }

          "| Package | Before | After |", "|---|---|---|", $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append

          $changed = [bool](git status --porcelain -- '*package-lock.json' '*package.json')
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Bump version and changelog
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $entry = "## [$version]`n`n### Update`n`n- Security: dependency updates via ``npm audit fix```n`n"
          Set-Content CHANGELOG.md -Value ($entry + (Get-Content CHANGELOG.md -Raw)) -NoNewline
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create and merge Pull-Request
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "automated_security_audit_fix_$env:VERSION"

          git config --global user.email "landau.daniel.1998@gmail.com"
          git config --global user.name "LemurDaniel"

          git checkout -B $branch
          git add -A
          git commit -m "Security: npm audit fix ($env:VERSION)"
          git push --set-upstream origin $branch

          gh pr create --base master --head $branch --title "Security: npm audit fix ($env:VERSION)" --body-file $env:GITHUB_STEP_SUMMARY
          gh pr merge $branch --squash --delete-branch

      - name: Dispatch deployment workflow
        if: steps.audit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run package.yaml --ref master -f skip_publish=false
